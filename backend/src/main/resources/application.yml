server:
  port: 8080
  shutdown: graceful
  forward-headers-strategy: framework
  tomcat:
    threads:
      max: ${HTTP_WORKERS:40}
      min-spare: 4
    max-connections: 200
    accept-count: 50
    connection-timeout: 10s
spring:
  lifecycle:
    timeout-per-shutdown-phase: 20s
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${SUPABASE_ISSUER_URI:https://replace-me.supabase.co/auth/v1}
          jwk-set-uri: ${SUPABASE_JWK_SET_URI:https://replace-me.supabase.co/auth/v1/.well-known/jwks.json}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/chimaera?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC&characterEncoding=utf8}
    username: ${SPRING_DATASOURCE_USERNAME:chimaera}
    password: ${SPRING_DATASOURCE_PASSWORD:chimaera}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:12}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: 30000
      validation-timeout: 5000
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    clean-disabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch_size: 30
          time_zone: UTC
        order_inserts: true
        order_updates: true
chimaera:
  ai-service-url: ${AI_SERVICE_URL:http://localhost:8000}
  cors:
    allowed-origin-patterns: ${APP_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  auth:
    enabled: ${AUTH_ENABLED:false}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
