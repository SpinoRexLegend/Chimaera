spring:
  datasource:
    url: jdbc:h2:file:./data/chimaera;MODE=MySQL;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
  flyway:
    enabled: false
chimaera:
  ai-service-url: http://localhost:8000
  auth:
    enabled: ${AUTH_ENABLED:false}
