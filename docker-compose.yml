services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: chimaera
      MYSQL_USER: chimaera
      MYSQL_PASSWORD: chimaera
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - chimaera_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  ai-service:
    build: ./ai-service
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/chimaera?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC&characterEncoding=utf8
      SPRING_DATASOURCE_USERNAME: chimaera
      SPRING_DATASOURCE_PASSWORD: chimaera
      AI_SERVICE_URL: http://ai-service:8000
      AUTH_ENABLED: ${AUTH_ENABLED:-false}
      SUPABASE_ISSUER_URI: ${SUPABASE_ISSUER_URI:-https://replace-me.supabase.co/auth/v1}
      SUPABASE_JWK_SET_URI: ${SUPABASE_JWK_SET_URI:-https://replace-me.supabase.co/auth/v1/.well-known/jwks.json}
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      ai-service:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      VITE_API_URL: http://localhost:8080/api
      VITE_SUPABASE_URL: ${SUPABASE_URL:-}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:-}
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  chimaera_mysql:
